name: macOS checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-regression:
    name: macOS regression
    runs-on: macos-15
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Run unit and simulated portal checks
        run: make check
